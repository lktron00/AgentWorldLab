name: Real engine integration

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAY_USAGE_STATS_ENABLED: "0"
      MEM0_TELEMETRY: "False"
      ANONYMIZED_TELEMETRY: "False"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements/*.txt
            upstreams.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify reproducible recorded report
        run: |
          python3 scripts/build-example-report.py --check
          python3 scripts/build-campaign-example.py --check
          python3 scripts/build-study-example.py --check
      - name: Verify public network explorer
        run: |
          node --check explorer/app.mjs
          node --test explorer/test-model.mjs
          python3 scripts/build-explorer.py
          python3 scripts/build-explorer.py --check
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libmagic1 libcairo2 libgomp1
      - name: Install immutable upstreams and isolated runtimes
        run: python3 scripts/bootstrap.py
      - name: Verify installed engine versions and source revisions
        run: python3 scripts/doctor.py
      - name: Contracts, failures, isolation and three real engines
        run: ./scripts/test -q --basetemp=test-results
      - name: Offline CLI experiment and journal audit
        run: |
          ./scripts/experiment --policy baseline --seeds 7 --population 4 --warmup 1 --steps 2 --output test-results/offline-cli
          ./scripts/report test-results/offline-cli --check
      - name: Diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('test-results').rglob('*.log'):
              print(f'\n{path}\n{path.read_text(errors="replace")[-8000:]}')
          PY
